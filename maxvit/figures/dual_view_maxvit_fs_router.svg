<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#526378"/></marker>
 <style>
 text{font-family:DejaVu Sans,sans-serif;fill:#172b46;text-anchor:middle}
 .title{font-size:32px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px}
 .box{stroke:#bccbdc;stroke-width:1.5;rx:14;fill:#f3f6fa}
 .med{fill:#e7f4f0;stroke:#63a997}.lat{fill:#eaf0fd;stroke:#839fd4}.train{fill:#fff3e2;stroke:#d5a45f}.infer{fill:#eeeafa;stroke:#a293ca}
 .edge{fill:none;stroke:#526378;stroke-width:2.2;marker-end:url(#arrow)}
 .dash{stroke-dasharray:7 5;stroke:#aa7c38}
 </style>
</defs>
<rect width="1600" height="1320" fill="white"/>
<text x="800" y="49" class="title">Dual-view MaxViT for fluid-sensitive knee MRI</text>
<text x="800" y="80" class="body">Shared 2.5D encoder · compartment-specific sequence modeling · study-level prediction</text>

<rect x="240" y="110" width="460" height="85" class="box train"/>
<text x="470" y="140" class="head">TRAINING INPUT</text><text x="470" y="166" class="body">One sampled FS series / study / epoch</text><text x="470" y="187" class="small">Training augmentations enabled</text>
<rect x="900" y="110" width="460" height="85" class="box infer"/>
<text x="1130" y="142" class="head">INFERENCE INPUT</text><text x="1130" y="171" class="body">Every eligible FS series in the study</text>
<path d="M470 195 V216 H700 V235" class="edge"/><path d="M1130 195 V216 H900 V235" class="edge"/>
<rect x="350" y="235" width="900" height="90" class="box"/>
<text x="800" y="265" class="head">Shared series preprocessing</text><text x="800" y="292" class="body">Laterality normalization → predicted-center 130-mm IN-PLANE crop</text><text x="800" y="315" class="body">Resample to 32 slices → adjacent-slice, three-channel triplets</text>
<path d="M800 325 V350" class="edge"/>
<rect x="350" y="350" width="900" height="80" class="box"/>
<text x="800" y="380" class="head">Overlapping medial / lateral 65% compartment views</text><text x="800" y="409" class="body">Axial / coronal: crop columns · Sagittal: crop depth, then resample to 32</text>
<path d="M650 430 V450 H470 V470" class="edge"/><path d="M950 430 V450 H1130 V470" class="edge"/>
<rect x="290" y="470" width="360" height="70" class="box med"/>
<text x="470" y="498" class="head">Medial view</text><text x="470" y="525" class="body">32 × 3 × 256 × 160</text>
<rect x="950" y="470" width="360" height="70" class="box lat"/>
<text x="1130" y="498" class="head">Lateral view</text><text x="1130" y="525" class="body">32 × 3 × 256 × 160</text>
<path d="M470 540 V570" class="edge"/><path d="M1130 540 V570" class="edge"/>
<rect x="290" y="570" width="1020" height="85" class="box" style="fill:#e6edf6;stroke:#7893b6"/>
<text x="800" y="601" class="head">ONE SHARED ImageNet-pretrained MaxViT-Tiny encoder</text><text x="800" y="628" class="body">Two view passes, identical weights · spatial average pooling → one vector per triplet</text><text x="800" y="649" class="small">No third global encoder pass</text>
<path d="M470 655 V690" class="edge"/><path d="M1130 655 V690" class="edge"/>
<rect x="280" y="690" width="380" height="95" class="box med"/>
<text x="470" y="719" class="head">Medial BiGRU</text><text x="470" y="746" class="body">Label-specific attention over 32 tokens</text><text x="470" y="771" class="small">One pooled feature vector per label</text>
<rect x="940" y="690" width="380" height="95" class="box lat"/>
<text x="1130" y="719" class="head">Lateral BiGRU</text><text x="1130" y="746" class="body">Label-specific attention over 32 tokens</text><text x="1130" y="771" class="small">One pooled feature vector per label</text>
<path d="M660 737 H700 V815" class="edge"/><path d="M940 737 H900 V815" class="edge"/>
<rect x="610" y="815" width="380" height="75" class="box"/>
<text x="800" y="845" class="head">Label-wise feature fusion</text><text x="800" y="873" class="body">Concatenate → Linear → GELU</text>
<path d="M470 785 V920" class="edge"/><path d="M1130 785 V920" class="edge"/><path d="M800 890 V920" class="edge"/>
<rect x="280" y="920" width="350" height="85" class="box med"/>
<text x="455" y="949" class="head">Medial classifiers</text><text x="455" y="976" class="body">MCL · medial meniscus</text><text x="455" y="997" class="body">Medial OA</text>
<rect x="650" y="920" width="300" height="85" class="box"/>
<text x="800" y="952" class="head">Global classifiers</text><text x="800" y="981" class="body">Remaining seven targets</text>
<rect x="970" y="920" width="350" height="85" class="box lat"/>
<text x="1145" y="952" class="head">Lateral classifiers</text><text x="1145" y="981" class="body">Lateral meniscus · lateral OA</text>
<path d="M455 1005 V1030 H700 V1050" class="edge"/><path d="M800 1005 V1050" class="edge"/><path d="M1145 1005 V1030 H900 V1050" class="edge"/>
<rect x="600" y="1050" width="400" height="60" class="box"/><text x="800" y="1087" class="head">12 series-level logits</text>

<rect x="20" y="680" width="230" height="140" class="box train"/>
<text x="135" y="710" class="head">Auxiliary slice head</text><text x="135" y="741" class="body">Per-triplet logits</text><text x="135" y="768" class="body">Route-specific</text><text x="135" y="792" class="body">log-sum-exp pooling</text>
<path d="M290 612 H135 V680" class="edge dash"/>
<path d="M135 820 V1135 H410 V1160" class="edge dash"/>
<path d="M600 1080 H460 V1160" class="edge dash"/>
<rect x="240" y="1160" width="460" height="100" class="box train"/>
<text x="470" y="1191" class="head">TRAINING LOSS</text><text x="470" y="1220" class="body">Soft L85 targets; official gold overrides</text><text x="470" y="1246" class="body">BCE(primary) + 0.25 × BCE(auxiliary)</text>
<path d="M1000 1080 H1130 V1160" class="edge"/>
<rect x="900" y="1160" width="460" height="100" class="box infer"/>
<text x="1130" y="1191" class="head">INFERENCE — FINAL EMA WEIGHTS</text><text x="1130" y="1220" class="body">Sigmoid → mean over FS series → mean over folds</text><text x="1130" y="1246" class="body">One study-level prediction for each target</text>
<text x="800" y="1300" class="small">Dimensions: depth × channels × height × width. Dashed paths: training-only supervision. Centering does not shift depth.</text>
</svg>
